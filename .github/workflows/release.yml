name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next

# semantic-release needs to push the version-bump commit and create a GitHub
# Release. npm exchanges the GitHub OIDC identity for publish authorization.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release derives the next version from the full tag/commit
          # history — a shallow clone makes it misread or skip the release.
          fetch-depth: 0
          # semantic-release manages its own auth; the checkout token would
          # otherwise shadow it when pushing the release commit.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install npm release tooling
        run: |
          npm install --global npm@11.21.1
          npm ci --prefix scripts/release

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build

      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn semantic-release

      - name: Verify trusted publishing without releasing
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn semantic-release --dry-run
